experiment_name: madmaps-vlm-cubicasa5k-trial
compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10
environment:
  version: databricks_ai_v6
  dependencies:
    - trl==0.21.0
    - transformers==4.55.4
    - peft==0.17.1
    - datasets==3.6.0
    - accelerate==1.10.1
    - liger-kernel==0.6.2
    - Pillow>=11,<13
    - PyMuPDF>=1.25,<2
    - jsonschema>=4.23,<5
    - shapely>=2.0,<3
    - scipy>=1.14,<2
code_source:
  root_path: .
  include_paths:
    - run_training_trial.py
command: python -u "$CODE_SOURCE_PATH/run_training_trial.py"
env_variables:
  MADMAPS_TRIAL_ID: cubicasa5k-20261115-trial-02-liger
  PYTHONUNBUFFERED: '1'
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
timeout_minutes: 90
max_retries: 0
